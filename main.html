<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment #4 - Forms and Validation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
  /* Показываем текст ошибки, когда поле не прошло валидацию браузера */
  input:user-invalid ~ .invalid-feedback,
  textarea:user-invalid ~ .invalid-feedback,
  select:user-invalid ~ .invalid-feedback {
    display: block;
  }

  /* Показываем текст успеха, когда поле заполнено верно */
  input:user-valid ~ .valid-feedback,
  textarea:user-valid ~ .valid-feedback,
  select:user-valid ~ .valid-feedback {
    display: block;
  }
</style>
</head>
<body class="bg-light py-5">

    <div class="container">
        <h1 class="mb-4 text-center">Assignment #4: Forms & Validation</h1>

        <!-- Part 1 & 2: Contact Form with Bootstrap Grid & Validation (No JS) -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Contact Form (Part 1 & 2)</h5>
            </div>
            <div class="card-body">
                <!-- Форма отправляется стандартным способом, валидация работает на стороне браузера -->
                <form action="#" method="GET">
                    <div class="row g-3">
                        <!-- Name Field -->
                        <div class="col-md-6">
                            <label for="contactName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="contactName" placeholder="Enter your name" required>
                            <div class="invalid-feedback">Please enter your name.</div>
                            <div class="valid-feedback">Looks good!</div>
                        </div>

                        <!-- Email Field -->
                        <div class="col-md-6">
                            <label for="contactEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="contactEmail" placeholder="name@example.com" required>
                            <div class="invalid-feedback">Please provide a valid email.</div>
                            <div class="valid-feedback">Looks good!</div>
                        </div>

                        <!-- Message Field -->
                        <div class="col-12">
                            <label for="contactMessage" class="form-label">Message</label>
                            <textarea class="form-control" id="contactMessage" rows="3" placeholder="Type your message here..." required></textarea>
                            <div class="invalid-feedback">Message cannot be blank.</div>
                            <div class="valid-feedback">Looks good!</div>
                        </div>

                        <!-- Submit Button -->
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">Submit Form</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Part 3: Advanced Registration Form -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Registration Form (Part 3)</h5>
            </div>
            <div class="card-body">
                <form action="#" method="GET">
                    <div class="row g-3">
                        <!-- First & Last Name -->
                        <div class="col-md-6">
                            <label for="regFirstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="regFirstName" required>
                        </div>
                        <div class="col-md-6">
                            <label for="regLastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="regLastName" required>
                        </div>

                        <!-- Email -->
                        <div class="col-12">
                            <label for="regEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" required>
                        </div>

                        <!-- Password -->
                        <div class="col-md-6">
                            <label for="regPassword" class="form-label">Password (min 6 chars)</label>
                            <input type="password" class="form-control" id="regPassword" minlength="6" required>
                        </div>
                        <div class="col-md-6">
                            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="regConfirmPassword" minlength="6" required>
                        </div>

                        <!-- Gender Radio Buttons -->
                        <div class="col-md-6">
                            <label class="form-label d-block">Gender</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" required>
                                <label class="form-check-label" for="genderMale">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female" required>
                                <label class="form-check-label" for="genderFemale">Female</label>
                            </div>
                        </div>

                        <!-- Country Select Dropdown -->
                        <div class="col-md-6">
                            <label for="regCountry" class="form-label">Country</label>
                            <select class="form-select" id="regCountry" required>
                                <option value="" selected disabled>Choose country...</option>
                                <option value="kz">Kazakhstan</option>
                                <option value="us">United States</option>
                                <option value="uk">United Kingdom</option>
                            </select>
                        </div>

                        <!-- Hobbies Checkboxes -->
                        <div class="col-12">
                            <label class="form-label d-block">Hobbies</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                <label class="form-check-label" for="hobbyReading">Reading</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                <label class="form-check-label" for="hobbyCoding">Coding</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Sports</label>
                            </div>
                        </div>

                        <!-- Submit & Reset Buttons -->
                        <div class="col-12 mt-4">
                            <button class="btn btn-success" type="submit">Register</button>
                            <button class="btn btn-secondary" type="reset">Reset</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
