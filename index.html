<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment #4 - Forms and Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
        .main-box {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
        }
        section {
            padding: 24px 0;
            border-bottom: 1px solid #ddd;
        }
        section:last-child {
            border-bottom: none;
        }
        h2 {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <main class="main-box container">

        <section id="contact-form">
            <h2>Task 0-3</h2>
            <form action="#" method="get">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                               required maxlength="40" placeholder="Enter your name">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               required maxlength="80" placeholder="name@example.com">
                        <div class="form-text">Enter a valid email address.</div>
                    </div>
                    <div class="col-12 mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="4"
                                  required maxlength="300" placeholder="Write your message"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </section>

        <section id="registration">
            <h2>Task 4</h2>
            <form action="#" method="get">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" name="firstName" required maxlength="40">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" name="lastName" required maxlength="40">
                    </div>
                    <div class="col-12 mb-3">
                        <label for="regEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="regEmail" name="email" required placeholder="name@example.com">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="8">
                        <div class="form-text">Password must have at least 8 characters.</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="8">
                    </div>
                </div>

                <fieldset class="mb-3">
                    <legend class="fs-6">Gender</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="male" name="gender" value="male" required>
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="female" name="gender" value="female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="other" name="gender" value="other">
                        <label class="form-check-label" for="other">Other</label>
                    </div>
                </fieldset>

                <fieldset class="mb-3">
                    <legend class="fs-6">Hobbies</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="reading" name="hobbies" value="reading">
                        <label class="form-check-label" for="reading">Reading</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="sport" name="hobbies" value="sport">
                        <label class="form-check-label" for="sport">Sport</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="music" name="hobbies" value="music">
                        <label class="form-check-label" for="music">Music</label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="country" class="form-label">Country</label>
                    <select class="form-select" id="country" name="country" required>
                        <option value="">Choose a country</option>
                        <option value="kazakhstan">Kazakhstan</option>
                        <option value="uzbekistan">Uzbekistan</option>
                        <option value="kyrgyzstan">Kyrgyzstan</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </form>
        </section>
    </main>
</body>
</html>
